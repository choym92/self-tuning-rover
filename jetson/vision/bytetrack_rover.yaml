# Ultralytics ByteTrack defaults (8.4.172 bytetrack.yaml) except track_buffer.
# track_buffer counts processed frames, not seconds: 60 frames is about 2 s at the live loop's ~29 fps.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
